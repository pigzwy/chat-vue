---
# 生产编排:web(React 前端)对外,chat-vue(Nitro 后端)仅容器网络内可达。
# 更新:docker compose pull && docker compose up -d
# 回滚:把两个 image 换成 Docker Hub 上的历史 sha 标签再 up -d
services:
  chat-vue:
    image: llpig/chat-vue:latest
    container_name: chat-vue
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3009
    # 加入网关所在共享网络,SUB2API_BASE_URL 可直接写网关容器名
    networks:
      - default
      - app-shared
    volumes:
      - chat-vue-data:/app/.data

  web:
    image: llpig/chat-vue-next:latest
    container_name: chat-vue-web
    restart: unless-stopped
    depends_on:
      - chat-vue
    ports:
      - "${APP_PORT:-3009}:3400"
    environment:
      NODE_ENV: production
      # /api 与 /sub2api 经容器网络转发给 Nitro,再由 Nitro 按 .env 打到网关
      BACKEND_ORIGIN: http://chat-vue:3009
      # 创作台分组 id(运行时注入前端,改 .env 后 up -d 即生效)
      MEDIA_GROUP_OPENAI: ${MEDIA_GROUP_OPENAI:-}
      MEDIA_GROUP_GROK: ${MEDIA_GROUP_GROK:-}
      MEDIA_GROUP_NANOBANANA: ${MEDIA_GROUP_NANOBANANA:-}
      # 网关站点根(登录页注册/忘记密码、余额跳充值明细);SSO 接力入口可选
      GATEWAY_ORIGIN: ${GATEWAY_ORIGIN:-}
      SSO_CONNECT_URL: ${SSO_CONNECT_URL:-}

volumes:
  chat-vue-data:

networks:
  app-shared:
    external: true
