name: ci

on: push

jobs:
  ci:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]
        node: [22]

    env:
      NUXT_UI_PRO_LICENSE: ${{ secrets.NUXT_UI_PRO_LICENSE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Install node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm vite build

      - name: Typecheck
        run: pnpm run typecheck

      # server/ 与 shared/ 是全部业务逻辑所在,此前既无类型检查也无测试
      - name: Typecheck (server & shared)
        run: pnpm run typecheck:server

      - name: Test
        run: pnpm run test

      # shared/utils 与 web-next 的副本必须一致:价格字段漂移不报错,只会算错钱
      - name: Check shared layer sync
        run: pnpm run sync:shared:check

  web-next:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web-next

    env:
      # @heroui-pro/react 的 postinstall 需要它拉取 Pro 组件源码(仓库 Secrets 配置)
      HEROUI_AUTH_TOKEN: ${{ secrets.HEROUI_AUTH_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Install node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-next/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm exec eslint src --max-warnings=0

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Build
        run: pnpm run build
