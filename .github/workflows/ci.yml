name: ci

on: push

jobs:
  ci:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]
        node: [22]

    env:
      NUXT_UI_PRO_LICENSE: ${{ secrets.NUXT_UI_PRO_LICENSE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Install node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm vite build

      - name: Typecheck
        run: pnpm run typecheck

      # server/ 与 shared/ 是全部业务逻辑所在,此前既无类型检查也无测试
      - name: Typecheck (server & shared)
        run: pnpm run typecheck:server

      - name: Test
        run: pnpm run test

      # 共享层副本一致性由前端仓库 pigzwy/pig-studio 的 check-shared-sync 反向校验
      # (它经 GitHub API 拉本仓库 shared/utils 比对);本仓库不 checkout 前端,
      # 这里跑到的是"未找到前端仓库→跳过"分支,留着是为了本地开发时能用同一条命令
      - name: Check shared layer sync
        run: pnpm run sync:shared:check
