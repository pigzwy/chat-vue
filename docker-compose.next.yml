# React(next 分支)本机部署:backend(复用生产 Nitro 镜像,server 代码与 main 一致)
#   + web-next(Next 生产)。Caddy 的 studio.pigvibe.com 反代到 web-next(127.0.0.1:3400)。
#
# 两容器用 network_mode: host —— 本机 docker 网桥出网被封,backend 需直连
# sub2.pigcoder.com,故共享宿主网络栈;各服务绑定到 127.0.0.1,仅经 Caddy 对外。
#
# 用法(web-next 镜像先单独构建,compose 构建阶段无 DNS):
#   DOCKER_BUILDKIT=1 docker build --network=host \
#     --secret id=heroui_env,src=./web-next/.env -t studio-web-next:latest ./web-next
#   docker compose -f docker-compose.next.yml up -d --no-build
services:
  backend:
    image: llpig/chat-vue:latest
    container_name: studio-backend
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 127.0.0.1
      PORT: 3009
    volumes:
      - studio-backend-data:/app/.data

  web-next:
    # 宿主机 pnpm build 产物直挂(standalone 为工作区嵌套结构:server.js 在 web-next/ 下)。
    # 部署 = `cd web-next && pnpm build` + `docker compose up -d web-next`,无需 docker build。
    image: node:22-bookworm-slim
    container_name: studio-web-next
    restart: unless-stopped
    network_mode: host
    depends_on:
      - backend
    working_dir: /app
    command: ["node", "web-next/server.js"]
    volumes:
      # 挂 .deploy 暂存目录而非 .next 本体:构建会重建 .next,与运行中容器的
      # 挂载互相打架会损坏产物(踩过:standalone 被打空 502)。
      # 部署脚本:pnpm build && rsync 三件套到 .deploy && compose restart web-next
      # 外层不加 :ro——docker 需在其中创建嵌套挂载点目录
      - ./web-next/.deploy/standalone:/app
      - ./web-next/.deploy/static:/app/web-next/.next/static:ro
      - ./web-next/.deploy/public:/app/web-next/public:ro
    environment:
      NODE_ENV: production
      HOSTNAME: 127.0.0.1
      PORT: 3400
      BACKEND_ORIGIN: http://127.0.0.1:3009
      # 创作台分组 id(取自根 .env,运行时经 /api/app-config 注入前端)
      MEDIA_GROUP_OPENAI: ${MEDIA_GROUP_OPENAI:-}
      MEDIA_GROUP_GROK: ${MEDIA_GROUP_GROK:-}
      MEDIA_GROUP_NANOBANANA: ${MEDIA_GROUP_NANOBANANA:-}
      # 本机调试:保留手动贴凭证入口(E2E 走 sk)
      GATEWAY_ORIGIN: ${GATEWAY_ORIGIN:-}
      SSO_CONNECT_URL: ${SSO_CONNECT_URL:-}
      ALLOW_KEY_LOGIN: "1"

volumes:
  studio-backend-data:
